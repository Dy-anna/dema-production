<style>
:root{--ink:#0a0a0a;--paper:#ffffff;--soft:#f3f2ef;--mut:#6b6b6b;--acc:#E8B04B}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
b,strong{font-weight:700}
header{position:fixed;top:0;left:0;right:0;z-index:30;color:#fff;mix-blend-mode:difference}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:22px;padding-bottom:22px}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:600;letter-spacing:.18em;font-size:12px;text-transform:uppercase}
.mark i{width:38px;height:38px;border-radius:50%;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-family:'Playfair Display',Georgia,serif;font-size:20px;letter-spacing:0}
header nav{display:flex;gap:22px;font-size:13px;font-weight:400}
header nav a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.hero{position:relative;height:100vh;min-height:560px;background:#000;color:#fff;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,.1) 60%),linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0) 40%)}
.hero .txt{position:absolute;z-index:2;left:0;right:0;bottom:12vh}
.dash{display:flex;gap:6px;margin-bottom:22px}.dash span{width:22px;height:2px;background:#fff;opacity:.5}.dash span:first-child{opacity:1}
.hero h1{margin:0;font-weight:300;font-size:clamp(36px,5.4vw,76px);line-height:1.04;letter-spacing:-.02em;max-width:900px}
.hero small{display:block;margin-top:20px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.intro{padding:120px 0 60px}
.intro .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:60px}
.intro .lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.intro p{margin:0;font-size:clamp(22px,2.3vw,32px);line-height:1.35;letter-spacing:-.01em}
.stats{padding:20px 0 100px}
.stats .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid #ddd}
.stat{padding:28px 20px 0 0}
.stat b{display:block;font-weight:300;font-size:clamp(40px,5vw,72px);letter-spacing:-.03em;line-height:1}
.stat span{display:block;margin-top:10px;font-size:14px;color:var(--mut);line-height:1.4}
.film{background:#000;padding:0}
.film .box{position:relative;aspect-ratio:16/9;max-height:100vh;width:100%;cursor:pointer;border:0;padding:0;background:#000;display:block}
.film .box img{width:100%;height:100%;object-fit:cover;opacity:.85}
.film .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:16px;color:#fff;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.film .play i{width:84px;height:84px;border-radius:50%;border:1px solid #fff;display:flex;align-items:center;justify-content:center;transition:background .3s ease}
.film .box:hover .play i{background:var(--acc);border-color:var(--acc)}
.film iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.people{padding:110px 0}
.people h2,.shots h2{margin:0 0 34px;font-weight:300;font-size:clamp(30px,3.4vw,48px);letter-spacing:-.02em}
.people ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid #ddd}
.people li{padding:20px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:20px;align-items:baseline}
.people li b{font-weight:600;font-size:18px}
.people li span{color:var(--mut);font-size:14px;text-align:right}
.people li:nth-child(odd){padding-right:30px}.people li:nth-child(even){padding-left:30px;border-left:1px solid #ddd}
.ribbon{display:block;width:100%;height:120px;margin:-30px 0}
.shots{padding:40px 0 110px;background:var(--soft)}
.shots .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.shots button{padding:0;border:0;border-radius:18px;overflow:hidden;cursor:zoom-in;background:#ddd}
.shots img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.shots button:hover img{transform:scale(1.04)}
.s1{grid-column:span 4;aspect-ratio:4/3}.s2{grid-column:span 2}.s3,.s4,.s5{grid-column:span 2;aspect-ratio:4/5}.s6{grid-column:span 6;aspect-ratio:21/9}
.credits{background:#000;color:#fff;padding:90px 0}
.credits .wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:60px;align-items:start}
.monogram{width:150px;height:150px}
.cred{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 30px}
.cred div small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9a9a9a;margin-bottom:6px}
.cred div span{font-size:15px;line-height:1.5}
.next{background:#000;color:#fff;border-top:1px solid #222}
.next a{display:flex;justify-content:space-between;align-items:center;gap:20px;text-decoration:none;padding:40px 0}
.next small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9a9a9a}
.next b{display:block;font-weight:300;font-size:clamp(28px,3.5vw,52px);letter-spacing:-.02em;margin-top:6px}
.next i{width:64px;height:64px;border-radius:50%;background:var(--acc);color:#000;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cta{padding:80px 0;text-align:center;background:#000;color:#fff;border-top:1px solid #222}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:16px 30px;border-radius:999px;background:var(--acc);color:#000;font-weight:600;text-decoration:none}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal img{max-width:min(1200px,100%);max-height:90vh;object-fit:contain;border-radius:12px}
.close{position:absolute;top:18px;right:18px;width:48px;height:48px;border-radius:50%;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
@media (max-width:860px){
  header nav a:not(.keep){display:none}
  .intro .wrap{grid-template-columns:1fr;gap:20px}
  .stats .wrap{grid-template-columns:1fr 1fr}
  .people ul{grid-template-columns:1fr}.people li:nth-child(even){padding-left:0;border-left:0}.people li:nth-child(odd){padding-right:0}
  .shots .grid{grid-template-columns:1fr 1fr}.s1,.s6{grid-column:span 2}.s2,.s3,.s4,.s5{grid-column:span 1;aspect-ratio:4/5}
  .credits .wrap{grid-template-columns:1fr}.cred{grid-template-columns:1fr 1fr}
}
</style>

(function(){
  var p=location.pathname, isEN=/^\/en(\/|$)/.test(p), base=isEN?'/en':'';
